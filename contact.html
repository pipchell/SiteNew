/*
  3CX chat popup size, tailored per device size.
  These override the --call-us-form-width/-height custom properties set in
  the widget's own style attribute. Kept as fixed values per tier rather
  than the earlier fluid calc(), for a more deliberately "designed" size at
  each breakpoint. If this causes the same kind of glitch the right/bottom
  override did earlier, remove this block and rely on the inline min()/calc()
  fallback values in the <call-us> tag instead.
*/
@media (max-width:480px){
#wp-live-chat-by-3CX{
--call-us-form-width:calc(100vw - 48px) !important;
--call-us-form-height:calc(100vh - 150px) !important;
--call-us-form-height:calc(100dvh - 150px) !important;
}
}

@media (min-width:481px) and (max-width:900px){
#wp-live-chat-by-3CX{
--call-us-form-width:340px !important;
--call-us-form-height:500px !important;
}
}

@media (min-width:901px){
#wp-live-chat-by-3CX{
--call-us-form-width:380px !important;
--call-us-form-height:560px !important;
}
}
