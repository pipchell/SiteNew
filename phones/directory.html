<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pip Chell - Phone Directory</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="index,nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.png" type="image/png" sizes="48x48">
<meta name="description" content="All network phone extensions, in one place.">

<style>
body {
  margin: 0;
  background: #fbfbfb;
  color: #3d3d3d;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  line-height: 1.5;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 48px 24px 60px;
}

header {
  text-align: center;
  margin-bottom: 42px;
}

h1 {
  font-size: 42px;
  margin: 0 0 10px;
  letter-spacing: -0.02em;
}

header p {
  color: #828282;
  margin: 0;
}

.section {
  margin-top: 34px;
}

.section h2 {
  margin: 0 0 14px;
  font-size: 21px;
  color: #828282;
  font-weight: 500;
}

.card {
  display: flex;
  align-items: flex-start;
  gap: 16px;
  background: #4696e5;
  padding: 18px;
  border-radius: 12px;
  margin-bottom: 14px;
  color: white;
  text-decoration: none;
}

.card img {
  width: 28px;
  height: 28px;
  flex-shrink: 0;
  display: block;
  position: relative;
  top: 2px;
}

.info strong {
  display: block;
  font-size: 17px;
  line-height: 1;
  margin-bottom: 4px;
}

.info span {
  display: block;
  font-size: 14px;
  font-family: Consolas, monospace;
  color: rgba(255, 255, 255, .9);
}

.info small {
  display: block;
  font-size: 13px;
  color: rgba(255, 255, 255, .8);
  margin-top: 5px;
}

.print-area {
  text-align: center;
  margin-top: 40px;
}

.print-btn {
  background: #4696e5;
  color: white;
  border: 0;
  border-radius: 10px;
  padding: 14px 24px;
  font-size: 15px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.print-btn img {
  width: 18px;
  height: 18px;
}

@media print {
  .print-area, .print-btn { display: none; }
  body { background: white; }
  .card { break-inside: avoid; }
}

@media (max-width: 600px) {
  h1 { font-size: 32px; }
  .container { padding: 32px 16px 50px; }
}
</style>
</head>

<body>
<div class="container">

<header>
  <h1>Pip Chell - Phone Directory</h1>
  <p>People · Call Handling · Codes</p>
</header>

<div class="section">

<h2>Important</h2>

<div class="card">
  <img src="/icons/d.png" alt="">
  <div class="info"><strong>Voicemail</strong><span>99999</span></div>
</div>

<div class="card">
  <img src="/icons/d.png" alt="">
  <div class="info"><strong>Set Available Status</strong><span>*30</span></div>
</div>

<div class="card">
  <img src="/icons/d.png" alt="">
  <div class="info"><strong>Set Away Status</strong><span>*31</span></div>
</div>

<h2>People</h2>
<div id="people"></div>

<h2>Call Handling</h2>
<div id="handling"></div>

<h2>Phone Codes</h2>
<div id="codes"></div>

<div class="print-area">
  <button class="print-btn" onclick="window.print()">
    Print Directory
  </button>
</div>

</div>
</div>

<script>
function renderList(targetId, iconPath, data) {
  const container = document.getElementById(targetId);
  if (!container) return;
  
  container.innerHTML = data.map(([name, number, desc = ""]) => `
    <div class="card">
      <img src="${iconPath}" alt="">
      <div class="info">
        <strong>${name}</strong>
        <span>${number}</span>
        ${desc ? `<small>${desc}</small>` : ""}
      </div>
    </div>
  `).join("");
}

// People section using p.png
renderList("people", "/icons/p.png", [
  ["Pip Chell", "18510"],
  ["Pip Chell (IP Phone)", "18511"],
  ["Simon Chell", "18512"],
  ["Benji Chell", "18513"],
  ["Network Admin", "18514"],
  ["Kartik Bhatt", "18515"],
  ["Jackie Bhatt", "18516"]
]);

// Call Handling section using p.png
renderList("handling", "/icons/p.png", [
  ["Digital Receptionist", "18560"],
  ["Pip Ring Group (Mobile & IP)", "18561"],
  ["External Line (In Dev!)", "Internal: 8562 External: 0333 038 4665"]
]);

// Phone Codes section using d.png
renderList("codes", "/icons/d.png", [
  ["Log Into Queues", "*62", "Logs your extension into assigned queues."],
  ["Log Out Of Queues", "*63", "Logs your extension out of assigned queues."],
  ["Set Status To Available", "*30", "Changes status to Available."],
  ["Set Status To Away", "*31", "Changes status to Away."],
  ["Set Status To Do Not Disturb", "*32", "Changes status to DND."],
  ["Leave Voicemail", "*4<extension>", "Leave voicemail without ringing. Example: *418510."],
  ["Billing Code Tag", "Number**BillingCode", "Adds a billing code. Example: 01234567890**SALES01."]
]);
</script>

</body>
</html>
